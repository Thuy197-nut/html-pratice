<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Luyện tập nhúng CSS</title>
    
    <!-- Phần 2: Sử dụng Internal CSS (nhúng trong thẻ <style>) -->
    <style>
        .internal-text {
            color: green;
        }
    </style>

    <!-- Phần 3: Sử dụng External CSS (liên kết file .css bên ngoài) -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bài tập nhúng CSS</h1>

    <!-- Phần 1: Sử dụng Inline CSS (viết trực tiếp trong thuộc tính style) -->
    <div>
        <h2>Phần 1: Inline CSS</h2>
        <p style="color: red;">Đoạn văn này được đổi màu bằng Inline CSS.</p>
    </div>

    <!-- Phần 2: Sử dụng Internal CSS -->
    <div>
        <h2>Phần 2: Internal CSS</h2>
        <p class="internal-text">Đoạn văn này được đổi màu bằng Internal CSS.</p>
    </div>

    <!-- Phần 3: Sử dụng External CSS -->
    <div>
        <h2>Phần 3: External CSS</h2>
        <p class="external-text">Đoạn văn này được đổi màu bằng External CSS.</p>
    </div>

</body>
</html>
