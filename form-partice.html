<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Bài tập Form Phần 1 và Phần 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- PHẦN 1 -->
    <h2>Phần 1: Form thông tin cá nhân</h2>
    <form action="#" method="POST">
        <p>Họ và tên[cite: 14]:</p>
        <input type="text" name="yourname" placeholder="Nhập họ và tên" size="30"/>

        <p>Email[cite: 14]:</p>
        <input type="email" name="email" placeholder="Nhập địa chỉ email" size="30"/>

        <p>Sở thích[cite: 14]:</p>
        <input type="checkbox" name="hobby" value="reading"/> Đọc sách <br/>
        <input type="checkbox" name="hobby" value="sports"/> Thể thao <br/>
        <input type="checkbox" name="hobby" value="music"/> Âm nhạc <br/>

        <p style="margin-top: 15px;">
            <input type="submit" value="Gửi thông tin"/>[cite: 14]
            <input type="reset" value="Nhập lại"/>[cite: 14]
        </p>
    </form>

    <!-- PHẦN 2 -->
    <h2>Phần 2: Form đăng ký học viên</h2>
    <form action="#" method="POST">
        <p>Full Name:</p>
        <input type="text" name="fullname" placeholder="Enter full name" size="30"/>

        <p>Select Course:</p>
        <select name="selectedCourse">
            <option value="html">HTML/CSS Basic</option>
            <option value="js">JavaScript Programming</option>
            <option value="react">ReactJS Framework</option>
        </select>

        <p>Gender:</p>
        <input type="radio" name="gender" value="male"/> Male 
        <input type="radio" name="gender" value="female"/> Female

        <p style="margin-top: 15px;">
            <input type="submit" value="Register"/>
            <input type="reset" value="Clear"/>
        </p>
    </form>

</body>
</html>
