<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Bootstrap Grid, Spacing & Display</title>
    <!-- Nhúng Bootstrap CSS từ CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- Bước 1: Cấu trúc Grid với 3 cột[cite: 28] -->
    <div class="container mt-5">
        <div class="row g-3">
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-4 border">
                <p class="mb-0">Phần 1</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-secondary text-white p-4 border">
                <p class="mb-0">Phần 2</p>
            </div>
            <div class="col-md-4 d-flex justify-content-center align-items-center bg-light p-4 border">
                <p class="mb-0">Phần 3</p>
            </div>
        </div>
    </div>

    <!-- Bước 2: Áp dụng Margin & Padding để điều chỉnh khoảng cách[cite: 28] -->
    <div class="container my-5 py-3 bg-light border rounded">
        <h3 class="text-center mb-0">Khoảng cách được điều chỉnh bằng Margin & Padding</h3>
    </div>

    <!-- Bước 3: Sử dụng Display Property để hiển thị ẩn hiện nội dung[cite: 28] -->
    <div class="container mb-5">
        <div class="d-none d-md-block bg-warning text-center p-3 rounded">
            <p class="mb-0">Nội dung này chỉ hiển thị trên màn hình lớn hơn 768px</p>
        </div>
    </div>

    <!-- Nhúng Bootstrap JS Bundle từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
