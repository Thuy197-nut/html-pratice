<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo layout với RWD</title>
    <link rel="stylesheet" href="style23.css">
</head>
<body>
    <div id="container">
        <!-- Phần tiêu đề trang -->
        <div id="header">
            <h1>Tiêu đề trang web (Header)</h1>
        </div>

        <!-- Thanh điều hướng -->
        <div id="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Dịch vụ</a>
            <a href="#">Liên hệ</a>
        </div>

        <!-- Phần chứa các cột nội dung -->
        <div id="content-container">
            <div class="col left-col">Cột trái (Sidebar)</div>
            <div class="col main-col">Nội dung chính (Main Content)</div>
            <div class="col right-col">Cột phải (Widgets)</div>
        </div>

        <!-- Phần cuối trang -->
        <div id="footer">
            <p>&copy; 2026 Bản quyền thuộc về trang web Responsive.</p>
        </div>
    </div>
</body>
</html>
