<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây dựng bố cục website với Div và CSS</title>
    <link rel="stylesheet" href="style17.css">
</head>
<body>
    <!-- Phân vùng chứa toàn bộ nội dung của trang -->
    <div id="main">
        
        <!-- Phân vùng đầu trang (Logo và Banner) -->
        <div id="head">
            <h1>Logo / Banner Website</h1>
        </div>

        <!-- Phân vùng liên kết đầu trang -->
        <div id="head-link">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Students</a></li>
                <li><a href="#">Course</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </div>

        <!-- Phân vùng nội dung bên trái -->
        <div id="left">
            <h3>Liên kết trái</h3>
            <ul>
                <li><a href="#">Danh mục 1</a></li>
                <li><a href="#">Danh mục 2</a></li>
            </ul>
        </div>

        <!-- Phân vùng nội dung chính -->
        <div id="content">
            <h2>Nội dung chính</h2>
            <p>Hot news, Photo Slide, News 1, v.v. hiển thị ở khu vực này.</p>
        </div>

        <!-- Phân vùng thông tin bên phải -->
        <div id="right">
            <h3>Tiện ích</h3>
            <p>Lịch, biểu đồ, bản đồ...</p>
        </div>

        <!-- Phân vùng cuối trang -->
        <div id="footer">
            <p>&copy; 2026 Bản quyền thuộc về chủ sở hữu trang web.</p>
        </div>

    </div>
</body>
</html>
