<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Danh sách sản phẩm</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <!-- Tiêu đề của trang -->
    <h1>Danh sách sản phẩm</h1>

    <!-- Bảng sản phẩm chứa các cột: Tên sản phẩm, Giá, Số lượng (gồm ít nhất 4 sản phẩm) -->
    <table>
        <tr>
            <th>Tên sản phẩm</th>
            <th>Giá</th>
            <th>Số lượng</th>
        </tr>
        <tr>
            <td>Laptop Dell Inspiron</td>
            <td>18,500,000 VNĐ</td>
            <td>5</td>
        </tr>
        <tr>
            <td>Điện thoại iPhone 15</td>
            <td>22,000,000 VNĐ</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Tai nghe Bluetooth Sony</td>
            <td>2,100,000 VNĐ</td>
            <td>15</td>
        </tr>
        <tr>
            <td>Bàn phím cơ Logitech</td>
            <td>1,500,000 VNĐ</td>
            <td>8</td>
        </tr>
    </table>

</body>
</html>
