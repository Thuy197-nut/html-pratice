<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Form đăng ký người dùng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            width: 350px;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        input[type="text"], input[type="email"] {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <h2>Form đăng ký người dùng</h2>
    
    <!-- Form gửi dữ liệu theo phương thức POST đến server của CodeGym -->
    <form action="http://demo.codegym.vn/6/registration_form/register.php" method="POST">
        
        <label>Họ và tên:</label>
        <input type="text" name="name" placeholder="Nhập họ và tên..." required />

        <label>Email:</label>
        <input type="email" name="email" placeholder="Nhập email..." required />

        <label>Số điện thoại:</label>
        <input type="text" name="phone" placeholder="Nhập số điện thoại..." required />

        <label>Giới tính:</label><br>
        <input type="radio" name="gender" value="Male" /> Nam 
        <input type="radio" name="gender" value="Female" /> Nữ <br><br>

        <input type="submit" value="Đăng ký" />
        
    </form>

</body>
</html>
