<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập CSS Flexbox Layout</title>
    <link rel="stylesheet" href="style37.css">
</head>
<body>
    <div class="page-container">
        <!-- Header -->
        <header class="header">
            <h1>Tiêu đề trang web (Header)</h1>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Dịch vụ</a>
            <a href="#">Liên hệ</a>
        </nav>

        <!-- Content Wrapper chứa Main Content và Sidebar (để tạo bố cục ngang trên Desktop) -->
        <div class="content-wrapper">
            <!-- Main Content -->
            <main class="main">
                <h2>Nội dung chính</h2>
                <p>Khu vực hiển thị nội dung chính của trang web.</p>
            </main>

            <!-- Sidebar -->
            <aside class="sidebar">
                <h3>Sidebar</h3>
                <p>Chứa nội dung phụ (tin tức, quảng cáo, v.v.).</p>
            </aside>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Bản quyền thuộc về trang web CSS Flexbox.</p>
        </footer>
    </div>
</body>
</html>
